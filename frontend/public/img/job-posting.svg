<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800" width="620" height="800" role="img" aria-label="A sample job posting with key requirements highlighted">
  <defs>
    <linearGradient id="sheet2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f1efe8"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b4a7a" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#3b4a7a" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="sheet2clip"><rect width="620" height="800" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#sheet2clip)">
    <rect width="620" height="800" fill="url(#sheet2)"/>

    <!-- browser chrome -->
    <rect width="620" height="44" fill="#191920" opacity=".05"/>
    <circle cx="26" cy="22" r="4.5" fill="#191920" opacity=".18"/>
    <circle cx="43" cy="22" r="4.5" fill="#191920" opacity=".14"/>
    <circle cx="60" cy="22" r="4.5" fill="#191920" opacity=".1"/>
    <rect x="84" y="13" width="300" height="18" rx="9" fill="#ffffff" opacity=".8"/>
    <rect x="96" y="20" width="176" height="5" rx="2.5" fill="#191920" opacity=".16"/>
    <line x1="0" y1="44" x2="620" y2="44" stroke="#191920" stroke-opacity=".1"/>

    <!-- job title -->
    <rect x="52" y="82" width="286" height="19" rx="4" fill="#191920" opacity=".85"/>
    <rect x="52" y="112" width="180" height="10" rx="4" fill="#191920" opacity=".28"/>

    <g fill="#191920" opacity=".16">
      <rect x="380" y="80" width="188" height="10" rx="5"/>
      <rect x="380" y="100" width="150" height="10" rx="5"/>
      <rect x="380" y="120" width="204" height="10" rx="5"/>
    </g>

    <!-- role requirements, highlighted as neutral keyword indicators -->
    <rect x="52" y="168" width="164" height="11" rx="3" fill="#191920" opacity=".7"/>

    <g>
      <rect x="52" y="200" width="130" height="26" rx="13" fill="url(#band)"/>
      <rect x="52" y="200" width="130" height="26" rx="13" fill="none" stroke="#3b4a7a" stroke-opacity=".5"/>
      <rect x="91" y="210" width="52" height="6" rx="3" fill="#3b4a7a" opacity=".6"/>
    </g>
    <g>
      <rect x="192" y="200" width="176" height="26" rx="13" fill="url(#band)"/>
      <rect x="192" y="200" width="176" height="26" rx="13" fill="none" stroke="#3b4a7a" stroke-opacity=".5"/>
      <rect x="254" y="210" width="52" height="6" rx="3" fill="#3b4a7a" opacity=".6"/>
    </g>
    <g>
      <rect x="52" y="234" width="96" height="26" rx="13" fill="url(#band)"/>
      <rect x="52" y="234" width="96" height="26" rx="13" fill="none" stroke="#3b4a7a" stroke-opacity=".5"/>
      <rect x="74" y="244" width="52" height="6" rx="3" fill="#3b4a7a" opacity=".6"/>
    </g>

    <!-- body copy with an underlined target phrase -->
    <g fill="#191920" opacity=".18">
      <rect x="52" y="294" width="516" height="9" rx="4.5"/>
      <rect x="52" y="313" width="482" height="9" rx="4.5"/>
      <rect x="52" y="332" width="504" height="9" rx="4.5"/>
    </g>

    <rect x="52" y="364" width="404" height="12" rx="3" fill="#14554c" opacity=".16"/>
    <line x1="52" y1="379" x2="456" y2="379" stroke="#14554c" stroke-opacity=".45" stroke-width="1"/>

    <g fill="#191920" opacity=".18">
      <rect x="52" y="402" width="498" height="9" rx="4.5"/>
      <rect x="52" y="421" width="366" height="9" rx="4.5"/>
    </g>

    <!-- checklist -->
    <rect x="52" y="470" width="122" height="11" rx="3" fill="#191920" opacity=".7"/>
    <g stroke="#14554c" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M57 502l4 4 8-9"/>
      <path d="M57 534l4 4 8-9"/>
      <path d="M57 566l4 4 8-9"/>
    </g>
    <g fill="#191920" opacity=".18">
      <rect x="86" y="501" width="248" height="9" rx="4.5"/>
      <rect x="86" y="533" width="300" height="9" rx="4.5"/>
      <rect x="86" y="565" width="212" height="9" rx="4.5"/>
    </g>

    <!-- marginalia tick marks -->
    <g stroke="#191920" stroke-opacity=".12">
      <line x1="560" y1="294" x2="560" y2="332"/>
      <line x1="552" y1="402" x2="560" y2="402"/>
      <line x1="552" y1="421" x2="560" y2="421"/>
      <line x1="560" y1="501" x2="560" y2="574"/>
    </g>

    <rect x="52" y="640" width="516" height="1" fill="#191920" opacity=".1"/>
    <rect x="52" y="668" width="150" height="36" rx="8" fill="#14554c" opacity=".16"/>
    <rect x="52" y="668" width="150" height="36" rx="8" fill="none" stroke="#14554c" stroke-opacity=".4"/>
    <rect x="74" y="682" width="106" height="8" rx="4" fill="#14554c" opacity=".55"/>
  </g>

  <rect x="0.5" y="0.5" width="619" height="799" rx="6" fill="none" stroke="#191920" stroke-opacity=".16"/>
</svg>
