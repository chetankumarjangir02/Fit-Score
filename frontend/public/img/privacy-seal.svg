<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="A sealed document that is discarded after reading">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f6f2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e8e5dd" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f0e9"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="150" y="120" width="420" height="300" rx="8"/></clipPath>
  </defs>

  <ellipse cx="360" cy="470" rx="290" ry="46" fill="url(#floor)"/>

  <!-- the sheet -->
  <g clip-path="url(#cardclip)">
    <rect x="150" y="120" width="420" height="300" rx="8" fill="url(#card)"/>
    <g fill="#191920" opacity=".18">
      <rect x="188" y="168" width="196" height="14" rx="4"/>
      <rect x="188" y="200" width="300" height="8" rx="4"/>
      <rect x="188" y="218" width="268" height="8" rx="4"/>
      <rect x="188" y="236" width="312" height="8" rx="4"/>
      <rect x="188" y="274" width="164" height="10" rx="3"/>
      <rect x="188" y="300" width="286" height="8" rx="4"/>
      <rect x="188" y="318" width="212" height="8" rx="4"/>
    </g>

    <!-- dissolving: the tail of the lines frays away -->
    <g fill="#191920" opacity=".07">
      <rect x="476" y="300" width="22" height="8" rx="4"/>
      <rect x="508" y="300" width="12" height="8" rx="4"/>
      <rect x="470" y="318" width="16" height="8" rx="4"/>
      <rect x="496" y="318" width="8" height="8" rx="4"/>
      <rect x="470" y="236" width="26" height="8" rx="4"/>
    </g>
    <g fill="#191920" opacity=".035">
      <circle cx="512" cy="304" r="3.5"/>
      <circle cx="528" cy="322" r="2.5"/>
      <circle cx="508" cy="324" r="2"/>
      <circle cx="518" cy="238" r="3"/>
    </g>
  </g>
  <rect x="150.5" y="120.5" width="419" height="299" rx="8" fill="none" stroke="#191920" stroke-opacity=".14"/>

  <!-- seal -->
  <g>
    <circle cx="360" cy="248" r="54" fill="#14554c" opacity=".12"/>
    <circle cx="360" cy="248" r="54" fill="none" stroke="#14554c" stroke-opacity=".45"/>
    <circle cx="360" cy="248" r="43" fill="none" stroke="#14554c" stroke-opacity=".28"/>
    <path d="M344 248l11 11 22-24" fill="none" stroke="#14554c" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- guard rails on either side: nothing leaves the machine -->
  <g stroke="#191920" stroke-opacity=".13" stroke-width="1.5" fill="none">
    <path d="M96 118v300"/>
    <path d="M624 118v300"/>
  </g>
  <g fill="#191920" opacity=".28" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.6">
    <text x="96" y="440" text-anchor="middle" transform="rotate(-90 96 440)">NO STORAGE</text>
    <text x="624" y="440" text-anchor="middle" transform="rotate(90 624 440)">NO ACCOUNTS</text>
  </g>

  <!-- ground rule + crop marks -->
  <line x1="120" y1="470" x2="600" y2="470" stroke="#191920" stroke-opacity=".12"/>
  <g stroke="#191920" stroke-opacity=".18" stroke-width="1.5">
    <path d="M56 40h22M56 40v22"/>
    <path d="M664 40h-22M664 40v22"/>
    <path d="M56 520h22M56 520v-22"/>
    <path d="M664 520h-22M664 520v-22"/>
  </g>
</svg>
